<!DOCTYPE html>
<html>
<head>
<title>Police Cases</title>
<style>
body {
    background: #0f172a;
    color: #e5e7eb;
    font-family: Arial;
}
.container {
    padding: 30px;
}
input {
    padding: 10px;
    width: 300px;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    border-bottom: 1px solid #1e293b;
    padding: 10px;
}
th {
    background: #020617;
}
</style>
</head>

<body>
<div class="container">

<h2>📁 Police Cases</h2>

<form method="get">
    <input type="text" name="q" placeholder="Search by FIR / Name" value="{{ query }}">
    <button type="submit">Search</button>
</form>

<table>
<tr>
    <th>FIR No</th>
    <th>Name</th>
    <th>Date</th>
</tr>

{% for case in cases %}
<tr>
    <td>{{ case.fir_number }}</td>
    <td>{{ case.person_name }}</td>
    <td>{{ case.incident_date }}</td>
</tr>
{% empty %}
<tr>
    <td colspan="3">No cases found</td>
</tr>
{% endfor %}

</table>

</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            background:#111;
            color:#fff;
            font-family: Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        form {
            background:#1e1e1e;
            padding:20px;
            border-radius:5px;
            width:300px;
        }
        input, button {
            width:100%;
            padding:8px;
            margin-top:10px;
        }
        button {
            background:#0aa;
            border:none;
            color:#000;
            font-weight:bold;
        }
        .error {
            color:red;
            margin-top:10px;
        }
    </style>
</head>
<body>

<form method="post">
    {% csrf_token %}
    <h2>Login</h2>

    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
</form>

</body>
</html>

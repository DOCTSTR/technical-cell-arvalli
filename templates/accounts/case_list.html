<!DOCTYPE html>
<html>
<head>
    <title>Police Cases</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📁 Police Cases</h3>
        <a href="/admin/accounts/case/add/" class="btn btn-primary">+ Add Case</a>
    </div>

    <table class="table table-bordered table-hover bg-white">
        <thead class="table-dark">
            <tr>
                <th>FIR No</th>
                <th>Police Station</th>
                <th>Crime Date</th>
                <th>Status</th>
                <th>Open</th>
            </tr>
        </thead>
        <tbody>
            {% for case in cases %}
            <tr>
                <td>{{ case.fir_number }}</td>
                <td>{{ case.police_station }}</td>
                <td>{{ case.crime_date }}</td>
                <td>{{ case.status }}</td>
                <td>
                    <a href="/admin/accounts/case/{{ case.id }}/change/"
                       class="btn btn-sm btn-outline-primary">
                        View / Edit
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No cases found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="/dashboard/" class="btn btn-secondary">⬅ Back to Dashboard</a>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>List</title>
</head>
<body>

<h2>{{ category|title }} List</h2>

<table border="1" cellpadding="10">
<tr>
    <th>Name</th>
    <th>Status</th>
    <th>Mobile</th>
</tr>

{% for p in persons %}
<tr>
    <td>{{ p.full_name }}</td>
    <td>{{ p.status }}</td>
    <td>{{ p.mobile_number }}</td>
</tr>
{% empty %}
<tr><td colspan="3">No data</td></tr>
{% endfor %}

</table>

</body>
</html>

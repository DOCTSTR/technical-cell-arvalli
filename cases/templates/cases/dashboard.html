<!DOCTYPE html>
<html>
<head>
    <title>Police Dashboard</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; padding:20px }
        .section { margin-bottom:40px }
        .cards { display:flex; gap:20px }
        .card {
            background:white; padding:20px; width:200px;
            border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.1)
        }
        a { text-decoration:none; color:black }
    </style>
</head>
<body>

<h1>🚔 Police Dashboard</h1>

<div class="section">
<h2>Cases</h2>
<div class="cards">
    <div class="card">Total Cases<br><b>{{ total_cases }}</b></div>
    <a href="/dashboard/list/wanted/"><div class="card">Wanted<br>{{ case_wanted }}</div></a>
    <a href="/dashboard/list/accused/"><div class="card">Accused<br>{{ case_accused }}</div></a>
    <a href="/dashboard/list/arrested/"><div class="card">Arrested<br>{{ case_arrested }}</div></a>
</div>
</div>

<div class="section">
<h2>Nasta Farta</h2>
<div class="cards">
    <div class="card">Total<br>{{ total_nasta }}</div>
    <div class="card">Wanted<br>{{ nasta_wanted }}</div>
    <div class="card">Accused<br>{{ nasta_accused }}</div>
    <div class="card">Arrested<br>{{ nasta_arrested }}</div>
</div>
</div>

</body>
</html>
